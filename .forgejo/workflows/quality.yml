name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout limpio
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar .NET 10 LTS fijado en global.json
        uses: https://data.forgejo.org/actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build, pruebas, cobertura, análisis, dependencias y paquete reproducible
        shell: pwsh
        run: ./eng/invoke-quality-gate.ps1 -LockedRestore -RequireClean -VerifyReproducible
