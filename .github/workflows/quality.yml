name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout limpio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET 10 LTS fijado en global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build, pruebas, cobertura, análisis, dependencias y paquete reproducible
        shell: pwsh
        run: ./eng/invoke-quality-gate.ps1 -LockedRestore -RequireClean -VerifyReproducible

      - name: Construir y verificar instalador de pruebas internas
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem artifacts/quality-*/package-a/publish-win-x64/build-manifest.json)
          if ($manifests.Count -ne 1) { throw 'Se requiere un único candidato aprobado.' }
          ./eng/build-internal-installer.ps1 -PackageDirectory $manifests[0].DirectoryName -OutputDirectory artifacts/internal-installer
          ./eng/assert-internal-installer.ps1 -InstallerDirectory artifacts/internal-installer

      - name: Conservar instalador para el equipo de pruebas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ticketfy-internal-installer-${{ github.sha }}
          path: |
            artifacts/internal-installer/*-Compartir.zip
            artifacts/internal-installer/installer-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Conservar resultados de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          # Publish reports only: the startup probe also creates disposable keys
          # and synthetic databases in TestResults, which must stay on the runner.
          path: |
            artifacts/quality-*/TestResults/*.trx
            artifacts/quality-*/TestResults/*/coverage.cobertura.xml
            artifacts/quality-*/TestResults/*-dependencies.json
            artifacts/quality-*/TestResults/startup-*/startup-verification.json
            artifacts/internal-installer/installer-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Conservar candidato verificable (sin firma, no es una aprobación comercial)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ticketfy-candidate-${{ github.sha }}
          path: |
            artifacts/quality-*/package-a/*.zip
            artifacts/quality-*/package-a/*.sha256
            artifacts/quality-*/package-a/startup-verified.json
            artifacts/quality-*/package-a/publish-win-x64/build-manifest.json
          if-no-files-found: error
          retention-days: 30
